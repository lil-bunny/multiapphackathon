[project]
name = "multiapphackathon"
version = "0.1.0"
description = "Multi-app shipment CRM agent for hackathon"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.128.8",
    "httpx>=0.28.1",
    "langgraph>=0.6.11",
    "pydantic>=2.13.1",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.39.0",
    "google-api-python-client>=2.150.0",
    "google-auth>=2.35.0",
    "pymupdf>=1.26.0",
    "fpdf2>=2.8.0",
    "openai>=2.33.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
